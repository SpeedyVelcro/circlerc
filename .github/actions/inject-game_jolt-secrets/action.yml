name: Inject Game Jolt Secrets
description: "Injects the Game Jolt private key into the Secrets.gd file at the project's root."
inputs:
  private-key:
    description: "The game's Game Jolt private key."
    required: true
runs:
  using: "composite"
  steps:
    - name: Inject Secrets
      shell: "bash"
      run: |
        command=sed
        if [ "${{ runner.os }}" == 'macOS' ]; then
          brew install gnu-sed
          command=gsed
        fi
        ${command} -i 's/replace_me_game_jolt_private_key/${{ inputs.private-key }}/' Secrets.gd

