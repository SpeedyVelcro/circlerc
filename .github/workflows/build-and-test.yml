name: Build and Test
on:
  push:
    branches:
      - "*"
  workflow_dispatch:
env:
  GODOT_VERSION: "4.7.2"
  GODOT_STREAM: "stable"
  GAME_SLUG: "circlerc"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Godot Engine
        uses: "./.github/actions/install-godot"
        with:
          version: ${{ env.GODOT_VERSION }}-${{ env.GODOT_STREAM }}
          sha_256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          platform: "linux.x86_64"
      - name: Install Export Templates
        uses: "./.github/actions/install-export-templates"
        with:
          version: ${{ env.GODOT_VERSION }}-${{ env.GODOT_STREAM }}
          sha_256: "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"
      - name: Inject Version Number
        run: |
          grep 'config/version=".*"' project.godot || exit 1 # Need this in project.godot for injection to work
          sed -i 's/\(config\/version="\).*\("\)/\1${{ needs.get-tag.outputs.tag }}\2/' project.godot
      - name: Build
        run: make linux-x86_64
      - name: Package
        id: package
        run: |
          mkdir -p zip_root
          cp -r build/linux-x86_64/* zip_root
          rm -f zip_root/.gitkeep
          (cd zip_root && zip -r \
            "../${{ env.GAME_SLUG }}-linux-x86_64-ci.zip" \
            ./*)
          (cd zip_root && tar -czf \
            "../${{ env.GAME_SLUG }}-${tarbuild}-${{ needs.get-tag.outputs.tag }}.tar.gz" \
            ./*)
          rm -rf zip_root
      - name: Upload Build Artifacts
        if: steps.package-all.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: builds
          path: ${{ env.GAME_SLUG }}-linux-x86_64-ci.*
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Remove this line if/when tests are added to the repo
    if: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Run gdUnit4 Tests
        uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: "4.7.2"
          godot-status: "stable"
          paths: |
            res://test
          version: "v6.1.3"
          publish-report: false # true causes failure due to read-only permission

