# This workflow will call when creating a main version tag or release (vX.X.X) or
# a platform version tag or release (vX.X.X-ng etc.), and populate tags and releases
# accordingly. For a main version tag or release you will end up with releases
# for platforms as well, but if you trigger this with a platform version tag or
# release, it will just populate that release.
#
# It is advised to make a new release by just making a release on GitHub with
# the tag in the form "vX.X.X" and then let this pipeline do the rest.
#
